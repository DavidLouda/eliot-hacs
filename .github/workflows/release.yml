name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, must match manifest.json (e.g. 1.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub release
    # Manual releases only from the default branch
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Check version
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version $VERSION"
            exit 1
          fi
          manifest_version=$(jq -r .version custom_components/eliot/manifest.json)
          if [ "$manifest_version" != "$VERSION" ]; then
            echo "::error::manifest.json version $manifest_version does not match $VERSION"
            exit 1
          fi

      - name: Extract release notes from CHANGELOG.md
        run: |
          awk -v version="$VERSION" '
            /^## / { if (found) exit; found = ($2 == version); next }
            found
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi

      # Creates the tag on the released commit when it does not exist yet
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$VERSION" --title "$VERSION" --notes-file release_notes.md --target "$GITHUB_SHA"
